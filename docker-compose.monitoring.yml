# Monitoring stack: Prometheus + Grafana for ORCA Forex Engine
#
# Usage (with main app stack):
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Grafana:  http://localhost:3001  (admin / orca)
# Prometheus: http://localhost:9090
# Metrics:  http://localhost:3000/api/metrics
#           http://localhost:3000/api/v1/forex/metrics
#
# Note: In-process metrics reset on each serverless cold start (Vercel).
# Self-hosted `web` service keeps a stable process → continuous series.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - orca_prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - default

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-orca}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - orca_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - default

volumes:
  orca_prom_data:
  orca_grafana_data:
